<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tài Chính — CEO OS</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B0E14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" href="/static/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0B0E14;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      letter-spacing: -0.01em;
    }
    /* Quiet Luxury Card: Matte finish, hairline border, no neon */
    .matte-card {
      background: #111520;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.4);
    }
    .matte-subcard {
      background: #161C2B;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    /* iOS Style Circle Keypad */
    .ios-key {
      background: #161C2B;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ios-key:active {
      transform: scale(0.92);
      background: #252F47;
      border-color: rgba(255, 255, 255, 0.15);
    }
    .pill-select {
      background: #161C2B;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #94A3B8;
      transition: all 0.15s ease;
    }
    .pill-select.active {
      background: #F1F5F9;
      color: #0B0E14;
      font-weight: 700;
      border-color: #F1F5F9;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-24 select-none">

  <!-- TOP BAR (TỐI GIẢN KIỂU APPLE / LINEAR) -->
  <header class="border-b border-slate-800/40 bg-[#0B0E14]/90 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-md mx-auto px-5 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700/80 flex items-center justify-center text-xs font-semibold text-slate-200">
          đ
        </div>
        <div class="text-sm font-semibold text-slate-100 tracking-tight">
          Sổ tài chính
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs">
        <a href="/api/export-excel" download class="px-2.5 py-1 rounded-md text-slate-300 bg-slate-900 border border-slate-800 hover:text-white transition-all">
          Xuất Excel
        </a>
        <button onclick="fetchOverview(true)" class="p-1.5 rounded-md text-slate-400 hover:text-slate-200 bg-slate-900 border border-slate-800 transition-all">
          <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- NỘI DUNG CHÍNH (THIẾT KẾ ĐIỀM TĨNH, KHÔNG BÓNG BẨY) -->
  <main class="max-w-md mx-auto px-5 mt-4 space-y-4">

    <!-- THẺ TÀI SẢN RÒNG (MATTE BLACK TITANIUM - LÌ VÀ CHẮC CHẮN) -->
    <div class="matte-card rounded-2xl p-5">
      <div class="flex justify-between items-baseline">
        <span class="text-xs font-medium text-slate-400">Tài sản ròng</span>
        <span class="text-[11px] text-emerald-400 font-medium flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Trực tuyến
        </span>
      </div>
      
      <div class="mt-2 flex items-baseline gap-1.5">
        <div id="hero-net-worth" class="text-3xl font-bold text-white tracking-tight">
          9.157.000.000
        </div>
        <span class="text-sm font-medium text-slate-400">đ</span>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-slate-800/80 text-xs">
        <div>
          <span class="text-slate-500 text-[11px]">Tài sản</span>
          <div id="hero-assets" class="font-semibold text-slate-200 mt-0.5">10.757.000.000 đ</div>
        </div>
        <div>
          <span class="text-slate-500 text-[11px]">Nợ phải trả</span>
          <div id="hero-liabilities" class="font-semibold text-slate-400 mt-0.5">1.600.000.000 đ</div>
        </div>
      </div>
    </div>

    <!-- TAB ĐIỀU HƯỚNG TỐI GIẢN (KHÔNG ĐỔ BÓNG RỰC RỠ) -->
    <div class="flex border-b border-slate-800/80 text-xs font-medium">
      <button onclick="switchTab('tab-input')" id="tab-btn-input" class="pb-2.5 px-3 border-b-2 border-slate-200 text-white font-semibold transition-all">
        Ghi chép
      </button>
      <button onclick="switchTab('tab-stats')" id="tab-btn-stats" class="pb-2.5 px-3 text-slate-400 hover:text-slate-200 transition-all">
        Tổng quan tháng
      </button>
      <button onclick="switchTab('tab-history')" id="tab-btn-history" class="pb-2.5 px-3 text-slate-400 hover:text-slate-200 transition-all">
        Lịch sử
      </button>
    </div>

    <!-- PHẦN 1: GHI CHÉP THU CHI (BÀN PHÍM SỐ TRÒN TRỊA THÂN THIỆN) -->
    <div id="tab-input" class="space-y-4 pt-1">
      
      <!-- Phân loại Thu / Chi dạng segmented control -->
      <div class="grid grid-cols-2 p-1 rounded-xl bg-slate-900 border border-slate-800/80 text-xs font-semibold">
        <button type="button" id="btn-type-chi" onclick="setType('Chi phí')" class="py-2 rounded-lg bg-[#161C2B] text-rose-400 shadow-sm transition-all">
          Chi tiêu
        </button>
        <button type="button" id="btn-type-thu" onclick="setType('Thu nhập')" class="py-2 rounded-lg text-slate-400 hover:text-slate-200 transition-all">
          Thu nhập
        </button>
      </div>

      <!-- MÀN HÌNH SỐ TIỀN CHÂN PHƯƠNG, TO RÕ RÀNG -->
      <div class="matte-subcard rounded-2xl p-4 text-center">
        <div class="text-[11px] text-slate-400 font-medium">Số tiền</div>
        <div class="mt-1 flex items-baseline justify-center gap-1">
          <span id="display-amount" class="text-4xl font-semibold text-white tracking-tight">0</span>
          <span class="text-lg text-slate-400 font-normal">đ</span>
        </div>
      </div>

      <!-- CHIP HẠNG MỤC THANH LỊCH (MÀU ĐẬM, CHỮ GỌN) -->
      <div>
        <div class="text-[11px] font-medium text-slate-400 mb-2">Hạng mục</div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5">
          <button type="button" onclick="selectCat(this, 'ĂN UỐNG, SINH HOẠT THIẾT YẾU TẠO LẬP GIÁ TRỊ GIA ĐÌNH')" class="cat-pill pill-select active shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Ăn uống
          </button>
          <button type="button" onclick="selectCat(this, 'CAFÉ, ĂN SÁNG, ĂN NGOÀI')" class="cat-pill pill-select shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Cafe, Ăn ngoài
          </button>
          <button type="button" onclick="selectCat(this, 'XĂNG XE, ĐIỆN THOẠI XÂY DỰNG MỐI QUAN HỆ')" class="cat-pill pill-select shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Đi lại
          </button>
          <button type="button" onclick="selectCat(this, 'HỌC TẬP (TỰ HỌC)')" class="cat-pill pill-select shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Học tập
          </button>
          <button type="button" onclick="selectCat(this, 'TIẾP KHÁCH XÂY DỰNG MỐI QUAN HỆ')" class="cat-pill pill-select shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Tiếp khách
          </button>
          <button type="button" onclick="selectCat(this, 'THUÊ NHÀ')" class="cat-pill pill-select shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Thuê nhà
          </button>
          <button type="button" onclick="selectCat(this, 'THU NHẬP TỪ LÀM TƯ')" class="cat-pill pill-select shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium">
            Thu nhập tư
          </button>
        </div>
      </div>

      <!-- Ô NHẬP NỘI DUNG & NGÀY -->
      <div class="grid grid-cols-3 gap-2 text-xs">
        <div class="col-span-2">
          <input type="text" id="input-note" placeholder="Ghi chú (tùy chọn)" class="w-full px-3 py-2 rounded-xl bg-[#111520] border border-slate-800 text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-slate-600">
        </div>
        <div>
          <input type="date" id="input-date" class="w-full px-2 py-2 rounded-xl bg-[#111520] border border-slate-800 text-slate-200 focus:outline-none focus:border-slate-600 text-center">
        </div>
      </div>

      <!-- BÀN PHÍM SỐ TRÒN KIỂU IPHONE PASSCODE / CALCULATOR -->
      <div class="grid grid-cols-3 gap-2.5 pt-1">
        <button type="button" onclick="pressNum('1')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">1</button>
        <button type="button" onclick="pressNum('2')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">2</button>
        <button type="button" onclick="pressNum('3')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">3</button>

        <button type="button" onclick="pressNum('4')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">4</button>
        <button type="button" onclick="pressNum('5')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">5</button>
        <button type="button" onclick="pressNum('6')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">6</button>

        <button type="button" onclick="pressNum('7')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">7</button>
        <button type="button" onclick="pressNum('8')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">8</button>
        <button type="button" onclick="pressNum('9')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">9</button>

        <button type="button" onclick="pressK('000')" class="ios-key py-3 rounded-xl text-sm font-medium text-slate-400">000</button>
        <button type="button" onclick="pressNum('0')" class="ios-key py-3 rounded-xl text-xl font-normal text-slate-200">0</button>
        <button type="button" onclick="pressBack()" class="ios-key py-3 rounded-xl text-slate-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414a2 2 0 011.414-.586H19a2 2 0 012 2v10a2 2 0 01-2 2h-7.172a2 2 0 01-1.414-.586L3 12z"/></svg>
        </button>
      </div>

      <!-- NÚT LƯU LÌ VÀ ĐẦM CHẮC (KHÔNG BÓNG BẨY) -->
      <button type="button" id="btn-submit-main" onclick="submitQuickTransaction()" class="w-full py-3.5 rounded-xl bg-slate-100 hover:bg-white active:scale-[0.98] text-slate-900 font-semibold text-sm transition-all flex items-center justify-center">
        Lưu giao dịch
      </button>

      <div id="toast-box" class="hidden p-2.5 rounded-xl text-xs font-medium text-center transition-all"></div>
    </div>

    <!-- PHẦN 2: THỐNG KÊ THÁNG (GỌN GÀNG VÀ CHUẨN MỰC) -->
    <div id="tab-stats" class="hidden space-y-3 pt-1">
      <div class="grid grid-cols-3 gap-2">
        <div class="matte-subcard p-3 rounded-xl text-center">
          <div class="text-[10px] text-slate-400 font-medium">Thu tháng 2</div>
          <div id="stat-m2-inc" class="text-xs font-semibold text-emerald-400 mt-1">--</div>
        </div>
        <div class="matte-subcard p-3 rounded-xl text-center">
          <div class="text-[10px] text-slate-400 font-medium">Chi tháng 2</div>
          <div id="stat-m2-exp" class="text-xs font-semibold text-rose-400 mt-1">--</div>
        </div>
        <div class="matte-subcard p-3 rounded-xl text-center">
          <div class="text-[10px] text-slate-400 font-medium">Dư ròng</div>
          <div id="stat-m2-net" class="text-xs font-semibold text-slate-200 mt-1">--</div>
        </div>
      </div>

      <div class="matte-card p-4 rounded-2xl">
        <div class="text-xs font-semibold text-slate-300 mb-2">Dòng tiền 12 tháng</div>
        <div class="h-44">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>

      <div class="matte-card p-4 rounded-2xl">
        <div class="text-xs font-semibold text-slate-300 mb-2">Khoản chi tiêu chính</div>
        <div id="top-cat-list" class="space-y-1.5"></div>
      </div>
    </div>

    <!-- PHẦN 3: LỊCH SỬ GIAO DỊCH DẠNG DANH SÁCH SẠCH SẼ -->
    <div id="tab-history" class="hidden space-y-2 pt-1">
      <div class="flex items-center justify-between text-xs text-slate-400 px-1 mb-1">
        <span>Gần đây</span>
        <span id="history-total-count">0 mục</span>
      </div>
      <div id="history-feed" class="space-y-1.5"></div>
    </div>

  </main>

  <script>
    let globalData = null;
    let currentAmountStr = "0";
    let currentType = "Chi phí";
    let currentCategory = "ĂN UỐNG, SINH HOẠT THIẾT YẾU TẠO LẬP GIÁ TRỊ GIA ĐÌNH";
    let monthlyChart = null;

    document.getElementById('input-date').value = new Date().toISOString().split('T')[0];

    function updateAmountDisplay() {
      const num = parseInt(currentAmountStr, 10) || 0;
      document.getElementById('display-amount').textContent = num.toLocaleString('vi-VN');
    }

    function pressNum(digit) {
      if (currentAmountStr === "0") {
        currentAmountStr = digit;
      } else if (currentAmountStr.length < 11) {
        currentAmountStr += digit;
      }
      updateAmountDisplay();
    }

    function pressK(suffix) {
      if (currentAmountStr !== "0" && currentAmountStr.length < 9) {
        currentAmountStr += suffix;
        updateAmountDisplay();
      }
    }

    function pressBack() {
      if (currentAmountStr.length > 1) {
        currentAmountStr = currentAmountStr.slice(0, -1);
      } else {
        currentAmountStr = "0";
      }
      updateAmountDisplay();
    }

    function setType(t) {
      currentType = t;
      const bChi = document.getElementById('btn-type-chi');
      const bThu = document.getElementById('btn-type-thu');
      if (t === 'Chi phí') {
        bChi.className = 'py-2 rounded-lg bg-[#161C2B] text-rose-400 shadow-sm transition-all';
        bThu.className = 'py-2 rounded-lg text-slate-400 hover:text-slate-200 transition-all';
      } else {
        bThu.className = 'py-2 rounded-lg bg-[#161C2B] text-emerald-400 shadow-sm transition-all';
        bChi.className = 'py-2 rounded-lg text-slate-400 hover:text-slate-200 transition-all';
      }
    }

    function selectCat(btn, cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      if (cat.includes('THU NHẬP')) setType('Thu nhập');
    }

    function switchTab(tabId) {
      ['tab-input', 'tab-stats', 'tab-history'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(tabId).classList.remove('hidden');

      ['tab-btn-input', 'tab-btn-stats', 'tab-btn-history'].forEach(id => {
        const btn = document.getElementById(id);
        btn.className = 'pb-2.5 px-3 text-slate-400 hover:text-slate-200 transition-all';
      });

      const activeBtnId = tabId === 'tab-input' ? 'tab-btn-input' : (tabId === 'tab-stats' ? 'tab-btn-stats' : 'tab-btn-history');
      document.getElementById(activeBtnId).className = 'pb-2.5 px-3 border-b-2 border-slate-200 text-white font-semibold transition-all';

      if (tabId === 'tab-stats' && globalData) {
        renderChart(globalData.monthly);
      }
    }

    async function fetchOverview(force = false) {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const res = await fetch(`/api/overview?force=${force}`);
        const data = await res.json();
        globalData = data;

        document.getElementById('hero-net-worth').textContent = data.kpis.net_worth;
        document.getElementById('hero-assets').textContent = data.kpis.total_assets + ' đ';
        document.getElementById('hero-liabilities').textContent = data.kpis.total_liabilities + ' đ';

        document.getElementById('stat-m2-inc').textContent = data.kpis.m2_income + ' đ';
        document.getElementById('stat-m2-exp').textContent = data.kpis.m2_expense + ' đ';
        document.getElementById('stat-m2-net').textContent = data.kpis.m2_net + ' đ';

        renderHistory(data.recent_transactions, data.total_transactions);
        renderTopCategories(data.top_categories);

      } catch (err) {
        console.error('Fetch error:', err);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      }
    }

    function renderHistory(txs, total) {
      document.getElementById('history-total-count').textContent = total + ' mục';
      const container = document.getElementById('history-feed');
      container.innerHTML = '';
      if (!txs || txs.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-500 py-4 text-center">Chưa có dữ liệu</div>';
        return;
      }
      txs.forEach(t => {
        const isIncome = t.type === 'Thu nhập';
        const card = document.createElement('div');
        card.className = 'matte-subcard p-3 rounded-xl flex items-center justify-between';
        card.innerHTML = `
          <div class="truncate pr-2">
            <div class="text-xs font-semibold text-slate-200 truncate">${t.content}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">${t.date} • ${t.category}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-xs font-semibold ${isIncome ? 'text-emerald-400' : 'text-slate-200'}">
              ${isIncome ? '+' : '-'}${t.amount} đ
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderTopCategories(cats) {
      const c = document.getElementById('top-cat-list');
      c.innerHTML = '';
      if (!cats || cats.length === 0) return;
      cats.slice(0, 5).forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-2 rounded-lg bg-[#111520] text-xs';
        row.innerHTML = `
          <span class="text-slate-300 truncate pr-2">${item.name}</span>
          <span class="font-medium text-slate-400 whitespace-nowrap">${Number(item.total).toLocaleString('vi-VN')} đ</span>
        `;
        c.appendChild(row);
      });
    }

    function renderChart(monthly) {
      const ctx = document.getElementById('monthlyChart').getContext('2d');
      if (monthlyChart) monthlyChart.destroy();

      monthlyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'],
          datasets: [
            {
              label: 'Thu',
              data: monthly.income,
              backgroundColor: '#10B981',
              borderRadius: 3
            },
            {
              label: 'Chi',
              data: monthly.expense,
              backgroundColor: '#64748B',
              borderRadius: 3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#94A3B8', font: { size: 10 } } }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#64748B', font: { size: 9 } } },
            y: {
              grid: { color: 'rgba(255,255,255,0.04)' },
              ticks: { color: '#64748B', font: { size: 9 }, callback: v => (v/1000000) + 'M' }
            }
          }
        }
      });
    }

    async function submitQuickTransaction() {
      const amtNum = parseInt(currentAmountStr, 10);
      const toast = document.getElementById('toast-box');
      const btn = document.getElementById('btn-submit-main');

      if (!amtNum || amtNum <= 0) {
        toast.className = 'p-2 rounded-xl text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 block';
        toast.textContent = 'Vui lòng nhập số tiền';
        setTimeout(() => toast.classList.add('hidden'), 2000);
        return;
      }

      const note = document.getElementById('input-note').value.trim() || (currentType === 'Chi phí' ? 'Chi tiêu' : 'Thu nhập');
      const date = document.getElementById('input-date').value;

      btn.disabled = true;
      btn.textContent = 'Đang lưu...';

      try {
        const res = await fetch('/api/transaction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: date,
            type: currentType,
            category: currentCategory,
            amount: amtNum.toString(),
            content: note
          })
        });
        const r = await res.json();
        if (res.ok) {
          toast.className = 'p-2 rounded-xl text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 block';
          toast.textContent = 'Đã lưu thành công';
          currentAmountStr = "0";
          updateAmountDisplay();
          document.getElementById('input-note').value = '';
          fetchOverview(false);
        } else {
          toast.className = 'p-2 rounded-xl text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 block';
          toast.textContent = r.detail || 'Lỗi lưu';
        }
      } catch (err) {
        toast.className = 'p-2 rounded-xl text-xs font-medium text-rose-400 bg-rose-500/10 border border-rose-500/20 block';
        toast.textContent = 'Lỗi kết nối';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Lưu giao dịch';
        setTimeout(() => toast.classList.add('hidden'), 2500);
      }
    }

    fetchOverview();
  </script>
</body>
</html>
